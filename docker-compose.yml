# ============================================================
# AIGameWorld-Studio · 知识库向量数据库：Qdrant
# 使用方式（项目根目录执行）：
#   docker compose up -d          # 启动（后台）
#   docker compose down           # 停止并删除容器
#   docker compose logs -f qdrant # 看实时日志
#
# Web UI Dashboard:  http://127.0.0.1:6333/dashboard
# HTTP API:          http://127.0.0.1:6333
# gRPC:              127.0.0.1:6334
# 数据目录:          ./data/qdrant/storage （持久化，不会丢）
#
# 国内镜像拉不下来？把 image 改成下面任意一个：
#   image: docker.m.daocloud.io/qdrant/qdrant:latest
#   image: hub.rat.dev/qdrant/qdrant:latest
#   image: dockerproxy.com/qdrant/qdrant:latest
# ============================================================

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ags_qdrant_studio
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP + Web UI Dashboard
      - "6334:6334"  # gRPC
    volumes:
      - ./data/qdrant/storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    # 如果是本地开发 + 只读本机，可以不开启 API key，简单方便
    # 需要开启 API key 的话，取消下面两行注释：
    # environment:
    #   - QDRANT__SERVICE__API_KEY=ags_qdrant_studio_key_xxx
