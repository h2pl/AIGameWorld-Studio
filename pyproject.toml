[project]
name = "aw-studio"
version = "0.1.0"
description = "AIGameWorld Studio - 世界创作工坊 / World Creation Workshop"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "jinja2>=3.1",
    "langchain-openai>=1.3",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "openai>=1.0",
    "mcp>=1.9,<2.0",                 # 知识库 MCP server（FastMCP，stdio transport；2.x 重写了 API 不向后兼容）
    "pytiled-parser>=2.2.9",
    "llama-index-core>=0.14.23",
    "llama-index-embeddings-huggingface>=0.7.0",
    "sentence-transformers>=5.6",   # BGE-M3 嵌入模型 / BGE-M3 embedding (Chinese semantic retrieval)
    "tokenizers>=0.22.0,<=0.23.0",  # 锁定兼容版本，避免 sentence-transformers import 失败
    "llama-index-vector-stores-chroma>=0.5.5",
    "chromadb>=1.5",
    "python-multipart>=0.0.32",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "html2text>=2025.4.15",
    "ddgs>=9.14.4",
    "scrapy>=2.17.0",
    "tldextract>=5.3.1",
    "rarfile>=4.4",
    "curl-cffi>=0.15.0",
    "pypdf>=6.14.2",
    "llama-index-readers-file>=0.6.0",
    "bm25s>=0.3.10",                      # Pure-Python BM25 engine (LlamaIndex's official BM25 backend; lexical leg of hybrid search)
    "jieba>=0.42.1",                      # Chinese tokenizer for BM25 (framework-native, no SQLite self-implementation)
    # Cross-encoder rerank 用 sentence-transformers.CrossEncoder(BAAI/bge-reranker-v2-m3)
    # （LlamaIndex 的 llama-index-postprocessor-huggingface-rerank 集成包已从 PyPI 下架，
    #  其底层即 sentence_transformers.CrossEncoder，故直接用该官方后端，非自研算法）
    "langchain-text-splitters>=0.3.0", # PDF-aware RecursiveCharacter chunking
    # Unstructured 为「可选」PDF 语义解析后端：partition_pdf 按文档元素（标题/表格/列表）
    # 切分，比 pypdf 纯文本提取更适合 RAG。reader 层固定 strategy="fast"（纯 pdfminer，不联网
    # 下载模型，离线稳定），未安装时自动降级到 pypdf 逐页兜底。
    # 注意：unstructured 0.25+ 把 spacy 等重型依赖塞进主依赖，安装较重（已用镜像安装）；
    # unstructured-inference 在 Windows 上被 upstream 标记为非 win32 默认排除，但本地 PDF 解析
    # 必需，故显式声明以保证可复现安装 + 避免 C 级 segfault。
    "unstructured>=0.16.0",
    "unstructured-inference>=1.6.0",
]

[dependency-groups]
# 可选：Unstructured 完整功能（含表格/图片/公式解析）。
#   系统级依赖（部分）：apt-get install libmagic1 libreoffice poppler-utils
pdf-advanced = [
    "unstructured[pdf]>=0.16.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
aw-studio = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# scripts/ 经常需要先设置 sys.path / reactor，再导入项目模块；含 HTML 模板字符串
"scripts/**" = ["E402", "E501"]
# e2e 测试脚本需要先初始化环境再导入
"e2e_kb_test.py" = ["E402", "E501"]
# 一次性工具脚本
"remove_gen.py" = ["E501"]
# Scrapy 子系统：reactor/asyncio 预装 + 延迟导入 + 命名风格
"src/services/crawler/scrapy_app/**" = ["E402", "N806", "N814"]
# Crawler 搜索模块：延迟导入 DDGS / SQLiteStore 等
"src/services/crawler/search.py" = ["N806"]
# 向量存储：底部延迟导入
"src/services/knowledge/vector_store.py" = ["E402"]
# SQLiteStore：顶部 UUID 导入
"src/utils/sqlite_store.py" = ["E402"]
# serve.py / cli.py：函数级常量命名（_KB_HTML_PATH 等是故意大写）
"src/serve.py" = ["N806"]
"src/cli.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"

# pyright 配置见 pyrightconfig.json
