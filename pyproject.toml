[project]
name = "aw-studio"
version = "0.1.0"
description = "AIGameWorld Studio - 世界创作工坊 / World Creation Workshop"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "jinja2>=3.1",
    "langchain-openai>=1.3",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "openai>=1.0",
    "pytiled-parser>=2.2.9",
    "llama-index-core>=0.14.23",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-vector-stores-chroma>=0.5.5",
    "chromadb>=1.5",
    "python-multipart>=0.0.32",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "html2text>=2025.4.15",
    "ddgs>=9.14.4",
    "scrapy>=2.17.0",
    "tldextract>=5.3.1",
    "rarfile>=4.4",
    "curl-cffi>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
aw-studio = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
