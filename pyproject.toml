[project]
name = "aw-studio"
version = "0.1.0"
description = "AIGameWorld Studio - 世界创作工坊 / World Creation Workshop"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "jinja2>=3.1",
    "langgraph>=1.2",
    "langchain-openai>=1.3",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "openai>=1.0",
    "pytiled-parser>=2.2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
aw-studio = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
