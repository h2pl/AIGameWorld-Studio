    topics: []
  merchant:
    gold: 0
    shop_inventory: []
equipment: # 装备 / Equipment (weapon→weapon_id, armor→armor_id)
  weapon: ""
  armor: ""
  shield: "" # 盾牌 / Shield
inventory: [] # 背包
