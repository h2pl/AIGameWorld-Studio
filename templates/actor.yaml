# actor 配角模板 / actor template (NPC)
# 字段名约定: 与 AIGameWorld domain Actor 模型 + SQLite actors 表一致

id: "" # Actor 唯一标识 / Actor unique ID (defName)
name: "" # 名称 / Name
role: "" # 身份 {blacksmith, guard, merchant, innkeeper, ...} / Role
race: "" # 种族 / Race
personality: "" # 性格描述 / Personality description
attributes: # 六维属性 / Six attributes
  str: 10
  dex: 10
  con: 10
  int: 10
  wis: 10
  cha: 10
combat: # 战斗数值（敌人必填）/ Combat stats (required for enemies)
  hp: 10
  ac: 10
  attack_bonus: 0
  damage_bonus: 0
functions: [] # 功能标签 [{dialogue, merchant, quest_giver, combat}]
function_data: # 按功能扩展数据（可选）/ Extended data per function (optional)
  merchant:
    gold: 0
    shop_inventory: []
  dialogue:
    topics: []
equipment: # 装备（可选）/ Equipment (optional)
  weapon: ""
  armor: ""
inventory: [] # 背包 [{item_id: "", qty: 1}]
