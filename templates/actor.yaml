id: "" # Actor 唯一标识 / Actor unique ID (defName)
name: "" # 名称 / Name
role: "" # 身份 / Role
race: "" # 种族 / Race
scene_id: "" # 所属场景 id / Starting scene ID
personality: "" # 性格描述 / Personality description
attributes: # 六维属性 / Six attributes
  str: 10
  dex: 10
  con: 10
  int: 10
  wis: 10
  cha: 10
