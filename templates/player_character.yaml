# player_character 主角团模板 / player character template
# 字段名约定: 与 AIGameWorld domain PlayerCharacter 模型 + SQLite player_characters 表一致

id: "" # PC 唯一标识 / PC unique ID (defName)
name: "" # 名称 / Name
role: "" # 职业 {warrior, mage, rogue, cleric, paladin, ranger, ...} / Class
race: "" # 种族 / Race
personality: "" # 性格描述 / Personality description
attributes: # 六维属性 / Six attributes
  str: 10
  dex: 10
  con: 10
  int: 10
  wis: 10
  cha: 10
combat: # 战斗数值 / Combat stats
  hp: 20
  max_hp: 20
  ac: 10
  attack_bonus: 0
  damage_dice: "1d6" # 伤害骰 / Damage dice
  damage_bonus: 0 # 伤害加值 / Damage bonus
character_arc: # 角色弧 / Character arc
  goal: ""
  flaw: ""
  turning_point: ""
equipment: # 初始装备 / Starting equipment
  weapon: ""
  armor: ""
  accessories: []
inventory: [] # 背包 [{item_id: "", qty: 1}]
