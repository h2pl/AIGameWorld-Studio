# scene_object 场景对象模板 / scene object template
# 字段名约定: 与 AIGameWorld domain SceneObject 模型 + SQLite scene_objects 表一致

id: "" # 对象唯一标识 / Object unique ID (defName)
name: "" # 名称 / Name
object_type: "" # 对象类型 {chest, door, trap, mechanism, decoration}
scene_id: "" # 所属场景 id / Parent scene ID (FK → scenes.id)
interact_data: # 交互数据（可选）/ Interaction data (optional)
  locked: false # 门: 是否上锁 / Door: lock status
  dc: 10 # 锁/陷阱: 难度等级 / DC
  loot_table: [] # 宝箱: 掉落 [{item_id: "", qty: 1}]
  damage: "" # 陷阱: 伤害 / Trap: damage (e.g. "1d6")
