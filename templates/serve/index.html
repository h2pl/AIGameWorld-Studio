<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGameWorld Studio — World Packs</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
header { background: #1e293b; padding: 2rem; border-bottom: 2px solid #334155; text-align: center; }
header h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: .5rem; }
header p { color: #94a3b8; font-size: .9rem; }
.container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.card { background: #1e293b; border-radius: 8px; padding: 1.25rem; border: 1px solid #334155; transition: .2s; }
.card:hover { border-color: #38bdf8; transform: translateY(-2px); }
.card a { color: #38bdf8; text-decoration: none; font-size: 1.1rem; font-weight: 600; }
.card .desc { color: #94a3b8; font-size: .85rem; margin-top: .5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { color: #64748b; font-size: .75rem; margin-top: .75rem; }
.empty { text-align: center; padding: 4rem 1rem; color: #64748b; }
.refresh { text-align: center; margin: 1rem; }
.refresh a { color: #64748b; }
</style>
</head>
<body>
<header><h1>📦 AIGameWorld Studio</h1><p>World Pack 浏览器 / Browser</p></header>
<div class="container">
{% if packs %}
{% for p in packs %}
<div class="card">
  <a href="/pack/{{ p.id }}">{{ p.name }}</a>
  <div class="desc">{{ p.desc or '暂无描述 / No description' }}</div>
  <div class="meta">{{ p.total }} entities · {{ p.id }}</div>
</div>
{% endfor %}
{% else %}
<div class="empty">暂无 World Pack / No packs found</div>
{% endif %}
</div>
<div class="refresh"><a href="/">🔄 刷新 / Refresh</a></div>
</body>
</html>
