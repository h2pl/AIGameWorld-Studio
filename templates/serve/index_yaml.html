<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGameWorld Studio — YAML World Packs</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
header { background: #1e293b; padding: 2rem; border-bottom: 2px solid #334155; text-align: center; }
header h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: .5rem; }
header p { color: #94a3b8; font-size: .9rem; }

.section { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 0; }
.section-title { font-size: 1.05rem; color: #64748b; margin-bottom: 1rem; padding-bottom: .5rem; border-bottom: 1px solid #1e293b; }
.section-title .badge { color: #38bdf8; margin-left: .5rem; font-weight: 400; }

.container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }

.card { background: #1e293b; border-radius: 8px; padding: 1.25rem; border: 1px solid #334155; transition: .2s; }
.card:hover { border-color: #38bdf8; transform: translateY(-2px); }
.card a { color: #38bdf8; text-decoration: none; font-size: 1.1rem; font-weight: 600; }
.card .desc { color: #94a3b8; font-size: .85rem; margin-top: .5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { color: #64748b; font-size: .75rem; margin-top: .75rem; }

.empty { text-align: center; padding: 1rem; color: #334155; font-size: .85rem; }
.refresh { text-align: center; margin: 1rem; padding-bottom: 2rem; }
.refresh a { color: #64748b; }
</style>
</head>
<body>
<header><h1>📦 AIGameWorld Studio</h1><p>YAML World Pack 浏览器</p></header>

<div class="section">
  <div class="section-title">📁 YAML World Packs<span class="badge">{{ packs|length }}</span></div>
  <div class="container">
  {% if packs %}
  {% for p in packs %}
  <div class="card">
    <a href="/pack/{{ p.id }}">{{ p.name }}</a>
    <div class="desc">{{ p.desc or '暂无描述' }}</div>
    <div class="meta">{{ p.total }} entities · {{ p.id }}</div>
  </div>
  {% endfor %}
  {% else %}
  <div class="empty">暂无 YAML Pack</div>
  {% endif %}
  </div>
</div>

<div class="refresh"><a href="/">🔄 刷新</a></div>
</body>
</html>
