<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}知识库 · AIGameWorld Studio{% endblock %}</title>
<style>
/* 沿用 index_yaml.html 的深色主题，新增一些 class */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

/* 顶栏 */
header { background: #1e293b; padding: 1rem 1.5rem; border-bottom: 2px solid #334155; }
header .brand { display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.2rem; color: #38bdf8; }
header h1 a { color: inherit; text-decoration: none; }
header .sub { color: #94a3b8; font-size: .85rem; margin-top: .25rem; }

/* 导航栏 */
nav { display: flex; gap: 0; padding: 0 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; overflow-x: auto; }
nav a { padding: .75rem 1.25rem; color: #94a3b8; text-decoration: none; font-size: .9rem; border-bottom: 2px solid transparent; white-space: nowrap; }
nav a:hover, nav a.active { color: #38bdf8; border-bottom-color: #38bdf8; }
nav a .badge { background: #334155; padding: 2px 6px; border-radius: 4px; font-size: .75rem; margin-left: 4px; }

/* 内容区 */
.section { max-width: 1120px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.section-title { font-size: 1.05rem; color: #64748b; margin-bottom: 1rem; padding-bottom: .5rem; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
.section-title .badge { color: #38bdf8; margin-left: .5rem; font-weight: 400; }

/* 卡片容器 */
.container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.card { background: #1e293b; border-radius: 8px; padding: 1.25rem; border: 1px solid #334155; transition: .2s; }
.card:hover { border-color: #38bdf8; }
.card a { color: #38bdf8; text-decoration: none; font-size: 1.1rem; font-weight: 600; }
.card .desc { color: #94a3b8; font-size: .85rem; margin-top: .5rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { color: #64748b; font-size: .75rem; margin-top: .75rem; display: flex; flex-wrap: wrap; gap: .5rem; }

/* 标签 */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .75rem; border: 1px solid #334155; color: #cbd5e1; }
.tag-lore      { background: rgba(168,85,247,.12); border-color: rgba(168,85,247,.35); color: #c084fc; }
.tag-documents { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.35); color: #60a5fa; }
.tag-image     { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); color: #4ade80; }
.tag-video     { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.35); color: #fbbf24; }
.tag-status-done    { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); color: #4ade80; }
.tag-status-deleted { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.35); color: #f87171; }
.tag-status-parsing { background: rgba(234,179,8,.12); border-color: rgba(234,179,8,.35); color: #facc15; }
.tag-score { background: rgba(56,189,248,.12); border-color: rgba(56,189,248,.35); color: #38bdf8; font-weight: 600; }

/* 表单 */
.form-row { display: grid; grid-template-columns: 160px 1fr; gap: 1rem; align-items: center; padding: .4rem 0; }
.form-row label { color: #94a3b8; font-size: .85rem; }
.form-row input, .form-row select, .form-row textarea {
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: .5rem .75rem;
    font-size: .9rem;
    font-family: inherit;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,.2);
}

.btn {
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: #0f172a;
    padding: .6rem 1.1rem;
    border: none; border-radius: 6px;
    font-weight: 600; font-size: .9rem;
    cursor: pointer;
    transition: .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56,189,248,.3); }
.btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }
.btn-ghost { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; }
.btn-ghost:hover { background: rgba(56,189,248,.1); }
.btn-sm { padding: .25rem .55rem; font-size: .75rem; }

/* 拖拽区 */
.drop-zone {
    border: 2px dashed #334155;
    border-radius: 10px;
    padding: 3rem 1.5rem;
    text-align: center;
    color: #64748b;
    margin: 1rem 0;
    transition: .2s;
    background: rgba(30, 41, 59, .4);
    cursor: pointer;
}
.drop-zone.drag-over { border-color: #38bdf8; color: #38bdf8; background: rgba(56,189,248,.06); }
.drop-zone h3 { margin-bottom: .5rem; color: #94a3b8; font-weight: 500; }
.drop-zone p { font-size: .8rem; }

/* 表格 */
.table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.table th, .table td { padding: .6rem .75rem; border-bottom: 1px solid #1e293b; text-align: left; }
.table th { color: #64748b; font-weight: 500; background: #1e293b; border-bottom: 1px solid #334155; text-transform: uppercase; font-size: .7rem; letter-spacing: .05em; }
.table tr:hover td { background: rgba(30, 41, 59, .5); }
.table .nowrap { white-space: nowrap; }

/* 空状态 */
.empty { text-align: center; padding: 2rem 1rem; color: #475569; font-size: .9rem; border: 1px dashed #1e293b; border-radius: 8px; margin: 1rem 0; }

/* 搜索结果 */
.hit { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: .75rem; }
.hit header { background: none; padding: 0; border: none; margin-bottom: .4rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.hit .hit-title { color: #e2e8f0; font-weight: 600; }
.hit pre { background: #0f172a; padding: .75rem; border-radius: 6px; color: #cbd5e1; font-size: .8rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; border: 1px solid #1e293b; }
.hit .hit-meta { margin-top: .5rem; color: #64748b; font-size: .75rem; display: flex; gap: .5rem; flex-wrap: wrap; }
.hit .hit-meta span { color: #475569; }
.hit .hit-meta code { background: #0f172a; padding: 1px 6px; border-radius: 4px; font-size: .7rem; color: #94a3b8; border: 1px solid #1e293b; }

/* 进度条 */
.progress { background: #0f172a; border-radius: 99px; overflow: hidden; height: 10px; border: 1px solid #1e293b; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #22c55e); transition: width .3s ease; }

/* 提示 */
.alert { padding: .75rem 1rem; border-radius: 6px; font-size: .85rem; margin: .75rem 0; border: 1px solid transparent; }
.alert-info    { background: rgba(56,189,248,.1); border-color: rgba(56,189,248,.3); color: #7dd3fc; }
.alert-success { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); color: #86efac; }
.alert-error   { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); color: #fca5a5; }
.alert-warn    { background: rgba(234,179,8,.1); border-color: rgba(234,179,8,.3); color: #fde047; }

/* 顶部链接 */
.header-links { display: flex; gap: 1rem; font-size: .85rem; }
.header-links a { color: #64748b; text-decoration: none; }
.header-links a:hover { color: #38bdf8; }

.text-right { text-align: right; }
.text-muted { color: #64748b; }
.small { font-size: .75rem; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.inline-flex { display: inline-flex; gap: .35rem; align-items: center; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <h1><a href="/kb">📚 AIGameWorld Studio · 知识库</a></h1>
      <div class="sub">world-packs 知识管理 + 语义检索 · Chroma + BGE-M3</div>
    </div>
    <div class="header-links">
      <a href="/">📦 Pack 列表</a>
      <a href="/docs">📖 API (Swagger)</a>
      <a href="/redoc">🔎 ReDoc</a>
      <a href="/health">❤️ Health</a>
    </div>
  </div>
</header>

<nav>
  <a href="/kb"        class="{% if page=='search'   %}active{% endif %}">🔍 搜索</a>
  <a href="/kb/upload" class="{% if page=='upload'   %}active{% endif %}">⬆️ 上传</a>
  <a href="/kb/docs"   class="{% if page=='docs'     %}active{% endif %}">📄 文档 <span class="badge">列表</span></a>
  <a href="/kb/jobs"   class="{% if page=='jobs'     %}active{% endif %}">🕓 任务 / 审计</a>
</nav>

<main class="section">
  {% block body %}{% endblock %}
</main>

<script>
// 通用：world_id 记忆 + stats 摘要
const KB = {
  KEY_WORLD: 'aw_kb_world_id',
  getWorld(){ return localStorage.getItem(this.KEY_WORLD) || ''; },
  setWorld(w){ localStorage.setItem(this.KEY_WORLD, w); },
  async json(url, opts={}){
    const res = await fetch(url, Object.assign({ headers: { 'Accept': 'application/json' } }, opts));
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`HTTP ${res.status}: ${t.slice(0,200)}`);
    }
    return res.json();
  },
  fmtSize(n){
    if (n<1024) return n+' B';
    if (n<1024*1024) return (n/1024).toFixed(1)+' KB';
    return (n/1024/1024).toFixed(2)+' MB';
  },
  fmtTs(ts){
    if (!ts) return '-';
    const d = new Date(typeof ts==='string' ? ts : (ts>9999999999 ? ts : ts*1000));
    return d.toLocaleString();
  },
  sourceTag(source){
    const m = { lore:'tag-lore', documents:'tag-documents', image:'tag-image', video:'tag-video' };
    return `<span class="tag ${m[source]||''}">${source}</span>`;
  },
  statusTag(s){
    const m = { done:'tag-status-done', deleted:'tag-status-deleted', parsing:'tag-status-parsing', failed:'tag-status-deleted' };
    return `<span class="tag ${m[s]||''}">${s}</span>`;
  },
  // 通用：world picker <select> 初始化
  setupWorldPicker(selectEl, onChange){
    this.fetchWorlds().then(list=>{
      const cur = this.getWorld() || (list[0] && list[0].id) || '';
      selectEl.innerHTML = list.map(p=>`<option value="${p.id}">${this.escape(p.name)} (${p.id})</option>`).join('');
      if (cur && list.some(p=>p.id===cur)) selectEl.value = cur;
      this.setWorld(selectEl.value);
      if (onChange) {
        selectEl.addEventListener('change', e=>{ this.setWorld(e.target.value); onChange(e.target.value); });
        onChange(selectEl.value);
      }
    });
  },
  async fetchWorlds(){
    // 用 / API 返回 packs 列表 HTML，再用 JSON parse — 不，直接走同源 / 接口的 HTML 解析太慢，复用 /health 里的 source_dir 吗？
    // 简单做法：走 TestClient 一样的逻辑，直接读 / 然后正则解析 id — 更好做法：加一个 /api/packs endpoint。
    // 先做最小：加一个 endpoint。现在走 fallback：调用内置的 /api/packs (加)
    try { return await this.json('/api/packs'); } catch(e) { return []; }
  },
  escape(s){ return String(s??'').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
};
</script>
</body>
</html>
