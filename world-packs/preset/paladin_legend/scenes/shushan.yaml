# 蜀山主峰 / Shushan Main Peak

id: shushan
name: 蜀山天枢峰
type: outdoor
description: >
  云雾缭绕的仙山之巅，青石广场尽头矗立着太清殿。殿前有九十九级白玉台阶，
  两侧立着历代掌门的石像。广场中央是一柄巨大的石剑，剑身刻满符文。
  远处可见御剑飞行的弟子穿梭于五峰之间，仙鹤盘旋于云端。
exits:
  - target_scene: demon_sealing_tower
    condition: 需掌门许可  # Requires sect master's permission
  - target_scene: xianling_island
    condition: 御剑飞行  # Sword flight
  - target_scene: qingfeng_town
    condition: ""
landmarks:
  - id: taiji_hall
    name: 太清殿
    desc: 蜀山正殿，掌门清虚道长常居于此，殿内供奉三清像
  - id: sword_platform
    name: 演武台
    desc: 弟子习剑之所，地面刻有太极图
