# player_character 主角团模板 / player character template
# 字段名约定: 与 AIGameWorld domain PlayerCharacter 模型 + SQLite player_characters 表一致

id: "player_character_1" # PC 唯一标识 / PC unique ID (defName)
name: "PC 1" # 名称 / Name
role: "warrior" # 职业 {warrior, mage, rogue, cleric} / Class
race: "human" # 种族 / Race
personality: "待编辑 / TBD" # 性格描述 / Personality description
attributes: # 六维属性 / Six attributes
  str: 10
  dex: 10
  con: 10
  int: 10
  wis: 10
  cha: 10
combat: # 战斗数值（可选）/ Combat stats (optional)
  hp: 20
  ac: 10
  attack_bonus: 0
  damage_bonus: 0
character_arc: # 角色弧（可选）/ Character arc (optional)
  goal: ""
  flaw: ""
  turning_point: ""
equipment: # 初始装备（可选）/ Starting equipment (optional)
  weapon: ""
  armor: ""
  accessories: []
inventory: [] # 背包 [{item_id: "", qty: 1}]
